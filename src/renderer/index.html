<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechHelp Browser</title>
  <link rel="icon" href="./icon.svg">
  <link rel="stylesheet" href="browser.css">
</head>
<body>
  <!-- ══ TITLEBAR ══════════════════════════════════════════ -->
  <div id="titlebar">
    <div id="titlebar-drag"></div>
    <div id="titlebar-logo">
      <img src="./icon.svg" width="16" height="16" alt="">
      <span>TechHelp Browser</span>
    </div>
    <div id="window-controls">
      <button id="btn-min"   title="Minimieren">&#8211;</button>
      <button id="btn-max"   title="Maximieren">&#9633;</button>
      <button id="btn-close" title="Schließen">&#10005;</button>
    </div>
  </div>

  <!-- ══ TOOLBAR ═══════════════════════════════════════════ -->
  <div id="toolbar">
    <div id="nav-buttons">
      <button id="btn-back"    title="Zurück"     disabled>
        <svg viewBox="0 0 24 24"><polyline points="15,18 9,12 15,6"/></svg>
      </button>
      <button id="btn-forward" title="Vorwärts"   disabled>
        <svg viewBox="0 0 24 24"><polyline points="9,18 15,12 9,6"/></svg>
      </button>
      <button id="btn-reload"  title="Neu laden">
        <svg viewBox="0 0 24 24"><polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <button id="btn-home"    title="Startseite">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      </button>
    </div>

    <div id="addressbar-wrap">
      <span id="security-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L4 6v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V6L12 2z"/></svg>
      </span>
      <input id="addressbar" type="url"
        placeholder="Adresse oder Suche eingeben…"
        autocomplete="off" spellcheck="false">
    </div>

    <div id="toolbar-right">
      <button id="btn-bookmark" title="Lesezeichen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button id="btn-menu" title="Menü">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      </button>
    </div>
  </div>

  <!-- ══ LADEBALKEN ════════════════════════════════════════ -->
  <div id="progress-bar"><div id="progress-bar-inner"></div></div>

  <!-- ══ HAUPTBEREICH ══════════════════════════════════════ -->
  <div id="content-area">

    <!-- STARTSEITE -->
    <div id="home-page">
      <div id="home-inner">
        <div id="home-logo">
          <img src="./icon.svg" width="64" height="64" alt="TechHelp Browser">
          <h1>TechHelp Browser</h1>
          <p>Schnell. Sicher. Von TechHelp Support.</p>
        </div>
        <form id="home-search-form">
          <div id="home-search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="home-search" type="search" placeholder="Suchen oder URL eingeben…" autocomplete="off">
            <button type="submit">&#10140;</button>
          </div>
        </form>
        <nav id="shortcuts">
          <button class="shortcut" data-url="https://techhelp-support.de">
            <div class="shortcut-icon" style="background:#ff6363">⚡</div>
            <span>TechHelp</span>
          </button>
          <button class="shortcut" data-url="https://google.de">
            <div class="shortcut-icon" style="background:#4285f4">G</div>
            <span>Google</span>
          </button>
          <button class="shortcut" data-url="https://youtube.com">
            <div class="shortcut-icon" style="background:#ff0000">▶</div>
            <span>YouTube</span>
          </button>
          <button class="shortcut" data-url="https://discord.gg/kDAPDXdC7q">
            <div class="shortcut-icon" style="background:#5865f2">💬</div>
            <span>Discord</span>
          </button>
          <button class="shortcut" data-url="https://github.com">
            <div class="shortcut-icon" style="background:#333">
              <svg viewBox="0 0 24 24" fill="white" width="20" height="20"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            </div>
            <span>GitHub</span>
          </button>
        </nav>
      </div>
    </div>

    <!-- WEBVIEW -->
    <webview id="webview" src="about:blank" allowpopups></webview>

  </div>

  <!-- ══ DROPDOWN-MENÜ ═════════════════════════════════════ -->
  <div id="dropdown-menu" class="hidden">
    <div class="menu-section">
      <button class="menu-item" data-action="new-tab">🗂 Neuer Tab</button>
      <button class="menu-item" data-action="history">🕐 Verlauf</button>
      <button class="menu-item" data-action="downloads">⬇ Downloads</button>
      <button class="menu-item" data-action="bookmarks">🔖 Lesezeichen</button>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-section">
      <button class="menu-item" data-action="passwords">🔐 Passwörter</button>
      <button class="menu-item" data-action="payments">💳 Zahlungsmethoden</button>
      <button class="menu-item" data-action="collections">📚 Sammlungen</button>
      <button class="menu-item" data-action="reading-list">📖 Leseliste</button>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-section">
      <button class="menu-item" data-action="zoom-in">🔍 Vergrößern</button>
      <button class="menu-item" data-action="zoom-out">🔎 Verkleinern</button>
      <button class="menu-item" data-action="fullscreen">⛶ Vollbild</button>
    </div>
    <div class="menu-divider"></div>
    <div class="menu-section">
      <button class="menu-item" data-action="settings">⚙ Einstellungen</button>
      <button class="menu-item" data-action="check-updates">🔄 Nach Updates suchen</button>
    </div>
  </div>

  <!-- ══ SEITEN-PANEL ═══════════════════════════════════════ -->
  <div id="side-panel" class="hidden">
    <div id="side-panel-header">
      <span id="side-panel-title">Panel</span>
      <button id="side-panel-close">✕</button>
    </div>
    <div id="side-panel-body"></div>
  </div>

  <!-- ══ BENACHRICHTIGUNG ═══════════════════════════════════ -->
  <div id="notification" class="hidden"></div>

  <script src="browser-core.js"></script>
</body>
</html>
