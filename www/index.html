<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e0e">
  <title>TechHelp Browser</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- Toolbar -->
    <div class="toolbar" id="toolbar">
      <div class="nav-btns">
        <button class="nav-btn" id="btn-back" aria-label="Zurück" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15,18 9,12 15,6"/></svg>
        </button>
        <button class="nav-btn" id="btn-forward" aria-label="Vor" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9,18 15,12 9,6"/></svg>
        </button>
        <button class="nav-btn" id="btn-reload" aria-label="Neu laden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        </button>
        <button class="nav-btn" id="btn-home" aria-label="Startseite">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
        </button>
      </div>
      <div class="addressbar-wrap">
        <span class="security-icon" id="security-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2L4 6v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V6L12 2z"/></svg>
        </span>
        <input type="url" class="addressbar" id="addressbar"
          placeholder="Adresse oder Suche…"
          autocomplete="off" autocorrect="off" autocapitalize="off"
          spellcheck="false" enterkeyhint="go" aria-label="Adressleiste"/>
      </div>
    </div>

    <!-- Lade-Balken -->
    <div class="loading-bar" id="loading-bar">
      <div class="loading-bar-inner" id="loading-bar-inner"></div>
    </div>

    <!-- Startseite (wird ausgeblendet wenn eine URL geladen wird) -->
    <div class="home-page" id="home-page">
      <div class="home-glow" aria-hidden="true"></div>

      <div class="home-header">
        <div class="home-logo">
          <img src="./icon.svg" width="56" height="56" alt="" aria-hidden="true" class="home-logo-img">
          <h1 class="home-title">TechHelp Browser</h1>
        </div>
        <p class="home-subtitle">Schnell. Sicher. Von TechHelp Support.</p>
      </div>

      <div class="home-search-wrap">
        <form class="home-search" id="home-search-form" role="search">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" class="home-search-input" id="home-search-input"
            placeholder="Suchen oder URL eingeben…"
            enterkeyhint="search" aria-label="Suche oder URL"
            autocomplete="off" autocorrect="off" autocapitalize="off"/>
          <button type="submit" class="search-submit" aria-label="Suchen">→</button>
        </form>
      </div>

      <nav class="home-shortcuts" aria-label="Schnellzugriff">
        <button class="shortcut-item" data-url="https://techhelp-support.de" aria-label="TechHelp Support">
          <div class="shortcut-icon shortcut-icon--red">⚡</div>
          <span>TechHelp</span>
        </button>
        <button class="shortcut-item" data-url="https://google.de" aria-label="Google">
          <div class="shortcut-icon shortcut-icon--blue">G</div>
          <span>Google</span>
        </button>
        <button class="shortcut-item" data-url="https://youtube.com" aria-label="YouTube">
          <div class="shortcut-icon shortcut-icon--red">▶</div>
          <span>YouTube</span>
        </button>
        <button class="shortcut-item" data-url="https://discord.gg/kDAPDXdC7q" aria-label="Discord">
          <div class="shortcut-icon shortcut-icon--purple">💬</div>
          <span>Discord</span>
        </button>
        <button class="shortcut-item" data-url="https://github.com/LukasTechhelpSupport2907/Techhelp-Support-Browser" aria-label="GitHub">
          <div class="shortcut-icon shortcut-icon--dark">
            <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          </div>
          <span>GitHub</span>
        </button>
      </nav>
    </div>

    <!-- Webview-Container (native Android WebView via Capacitor) -->
    <div class="webview-container hidden" id="webview-container">
      <div class="webview-loading" id="webview-loading" aria-live="polite">
        <div class="webview-spinner" aria-hidden="true"></div>
        <p>Seite wird geladen…</p>
      </div>
    </div>

  </div>

  <script src="./capacitor.config.js" onerror="console.log('capacitor config not found')"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
